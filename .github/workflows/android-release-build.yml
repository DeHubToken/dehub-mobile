name: Android release build

on:
  workflow_dispatch:
    inputs:
      existing_build_id:
        description: Optional completed EAS build to verify without compiling again
        required: false
        type: string
      publish_release:
        description: Publish the verified APK to the public download page
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check native and app versions before building
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./app.json').expo.version;
          const gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          const native = gradle.match(/^\s*versionName\s+"([^"]+)"/m)?.[1];
          if (native !== version) {
            throw new Error(`Android version ${native} does not match app.json ${version}`);
          }
          NODE
      - run: npm ci --legacy-peer-deps
      # Native fixes must be present in the APK, not silently skipped by the
      # repository's best-effort postinstall hook.
      - run: npx patch-package --error-on-fail
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed APK on EAS
        if: inputs.existing_build_id == ''
        run: eas build --platform android --profile release-apk --non-interactive --wait --json > android-build.json
      - name: Recover a completed EAS build
        if: inputs.existing_build_id != ''
        env:
          BUILD_ID: ${{ inputs.existing_build_id }}
        run: eas build:view "$BUILD_ID" --json > android-build.json
      - name: Download and verify the signed APK
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('android-build.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          if (build.status !== 'FINISHED' || build.platform !== 'ANDROID' || !build.artifacts?.buildUrl) {
            throw new Error('EAS did not return a completed Android artifact');
          }
          if (process.env.PUBLISH_RELEASE === 'true' && build.gitCommitHash !== process.env.GITHUB_SHA) {
            throw new Error('Refusing to publish an APK built from a different commit');
          }
          fs.writeFileSync('apk-url.txt', build.artifacts.buildUrl);
          NODE
          curl --fail --location --retry 3 "$(cat apk-url.txt)" --output build-artifact
          python3 <<'PY'
          import shutil, tarfile, zipfile
          if zipfile.is_zipfile('build-artifact'):
              shutil.copyfile('build-artifact', 'dehub.apk')
          else:
              # Older production-apk builds archive both architecture outputs.
              # Select the same ARM64 artifact used by the public release.
              with tarfile.open('build-artifact') as archive:
                  matches = [m for m in archive.getmembers() if m.isfile() and m.name.rsplit('/', 1)[-1] == 'app-arm64-v8a-release.apk']
                  if len(matches) != 1:
                      raise RuntimeError('Expected exactly one ARM64 release APK')
                  with archive.extractfile(matches[0]) as source, open('dehub.apk', 'wb') as target:
                      shutil.copyfileobj(source, target)
          PY
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging dehub.apk > apk-badging.txt
          VERSION="$(node -p 'require("./app.json").expo.version')"
          grep '^package:' apk-badging.txt
          grep '^package:' apk-badging.txt | grep -F "name='io.dehub.mobile'" | grep -F "versionName='$VERSION'"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dehub.apk
          sha256sum dehub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android-apk
          path: |
            dehub.apk
            apk-badging.txt
      - name: Publish verified APK
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./app.json").expo.version')"
          # Creating a release fails if the version already exists: never
          # overwrite an APK another release run has already published.
          gh release create "v$VERSION" dehub.apk \
            --target "$GITHUB_SHA" --title "Android $VERSION" \
            --notes-file docs/android-release-notes.md --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-result
          path: android-build.json
          if-no-files-found: ignore
