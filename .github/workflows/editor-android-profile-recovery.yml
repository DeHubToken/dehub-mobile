name: Android profile recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/android-profiles/action.yml'
      - '.github/workflows/editor-android-profile-recovery.yml'

permissions:
  contents: read

concurrency:
  group: android-profile-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profiles:
    name: Android startup profile recovery
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/editor-android-profile-recovery-mobile-20261011')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx patch-package --error-on-fail
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: ./.github/actions/android-profiles
        with:
          environment: production
