name: OTA Rollback

# Reverts installed apps to the JS bundle embedded in their binary.
#
# Needed when a published update reaches devices that cannot run it. The case
# this was built for: `eas update` in CI bundles with whatever environment the
# runner has, and EXPO_PUBLIC_* values are inlined at bundle time. A build made
# without them produces a bundle whose Supabase client has no key, which throws
# at module load — the app dies before it renders, so there is no in-app route
# back and the user cannot do anything but uninstall.
#
# roll-back-to-embedded publishes a directive rather than a bundle: clients stop
# applying the branch's latest update and fall back to what shipped inside their
# APK. It cannot reach a device that never launches far enough to check, but
# expo-updates starts its fetch from the native side as the process comes up, so
# in practice a crash-looping app still picks it up within a launch or two.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: EAS update branch(es) to roll back, space separated.
        default: production preview
        required: false

concurrency:
  group: ota-publish
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back to embedded
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Say why nothing was rolled back
        if: env.EXPO_TOKEN == ''
        run: echo "::error::No EXPO_TOKEN secret is set, so there is nothing to publish with."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Roll back
        if: env.EXPO_TOKEN != ''
        env:
          ROLLBACK_BRANCHES: ${{ github.event.inputs.branch }}
        run: |
          # Non-interactive mode will not infer this, and it has to match the
          # runtimeVersion the bad updates were published at or the directive
          # reaches nobody. Read it from app.json so it cannot drift.
          RUNTIME="$(node -p "require('./app.json').expo.runtimeVersion")"
          echo "Rolling back runtime $RUNTIME"
          # Unquoted on purpose: this is a space-separated list, not one branch.
          for BRANCH in ${ROLLBACK_BRANCHES:-production preview}; do
            for PLATFORM in android ios; do
              echo "Rolling back $BRANCH ($PLATFORM)"
              eas update:roll-back-to-embedded --branch "$BRANCH" --platform "$PLATFORM" --runtime-version "$RUNTIME" --message "Roll back: CI-built bundle shipped without the app env vars" --non-interactive
            done
          done
