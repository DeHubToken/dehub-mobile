name: App Store status

on:
  workflow_dispatch:
    inputs:
      release_if_approved:
        description: Release the version if Apple approved it and it waits on us
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-store-status
  cancel-in-progress: false

jobs:
  status:
    name: Read App Store status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print App Store and TestFlight status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_IF_APPROVED: ${{ inputs.release_if_approved }}
        run: node scripts/app-store-status.mjs
