name: App Store status

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-status
  cancel-in-progress: false

jobs:
  status:
    name: Read App Store status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print App Store and TestFlight status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/app-store-status.mjs
