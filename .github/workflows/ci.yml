name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Typecheck and tests share one runner and one install. They were two jobs,
  # and `cache: npm` caches the download but not node_modules — so a dependency
  # tree this size paid the install twice per run to buy parallelism that a
  # 20-file suite does not need.
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # patches/ is in the key because postinstall runs patch-package: a changed
      # patch has to invalidate the cached tree.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'patches/**') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # A key added to en.json and nowhere else renders in English for every
      # other language: fallbackLng swallows it, so nothing throws and nobody
      # notices. orphan-baseline.json is the backlog being worked through — a
      # key outside it is a feature that shipped English-only, and fails here.
      - name: Badge asset resource names
        run: node scripts/check-badge-resource-names.mjs

      - name: i18n coverage
        run: |
          node scripts/build-locale-packs.mjs --metadata-only
          npm run i18n:coverage

      # The check above can only see a key that reaches no locale. It cannot
      # see text that was never keyed at all — that renders English in all 110
      # languages and merges green, which is how ~780 of them accumulated. Not
      # through screens anyone skipped: one row at a time, each added to a file
      # that was already translated. literal-baseline.json is that backlog; a
      # file above its entry fails here.
      - name: i18n hardcoded text
        run: npm run i18n:literals

      # A tool that reads UTF-8 as Latin-1 turns every dash, quote and emoji
      # into two or three junk characters. The JSON still parses and the diff
      # looks like ordinary copy, so nothing else here would catch it.
      - name: Mangled encoding check
        run: npm run i18n:mojibake

      # The translation fill's answer guards: loops on short words and inside
      # words, labels answered with a sentence, added markdown, and batches
      # answered out of step. Also run over batches cut from the locale files.
      - name: Translation fill guards
        run: node --test scripts/i18n-guards.test.mjs

      # <Icon> only renders icons listed in components/ui/iconRegistry.ts, so
      # the whole lucide set stays out of the bundle. A name used but not
      # registered renders as an empty box; tsc misses it behind `as any`.
      - name: Icon registry check
        run: npm run icons:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Wallet picker patch regression checks
        run: node --test scripts/wallet-picker.test.cjs

      # Thresholds are enforced by coverageThreshold in jest.config.js, so a
      # coverage regression fails this step directly.
      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # coverage-summary.json only exists now that jest.config.js lists the
      # json-summary reporter. Before that this guard fell through silently and
      # printed nothing on every run.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct + '%';
              console.log('Statements:', fmt(c.statements));
              console.log('Branches:  ', fmt(c.branches));
              console.log('Functions: ', fmt(c.functions));
              console.log('Lines:     ', fmt(c.lines));
            " >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage summary produced." >> $GITHUB_STEP_SUMMARY
          fi

  speed-preview:
    name: Android speed preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/android-startup-profiles-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx patch-package --error-on-fail
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Generate native startup and baseline profiles
        uses: ./.github/actions/android-profiles
        with:
          environment: preview
      - name: Build signed preview APK containing generated profiles
        run: eas build --platform android --profile test-apk --non-interactive --wait --json > android-preview.json
      - name: Record preview artifact
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('android-preview.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          if (build.status !== 'FINISHED' || !build.artifacts?.buildUrl) throw new Error('No completed preview APK');
          fs.writeFileSync('preview-apk-url.txt', build.artifacts.buildUrl);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `[Install the speed preview APK](${build.artifacts.buildUrl})\n`);
          NODE
          curl --fail --location --retry 3 "$(cat preview-apk-url.txt)" --output dehub-speed-preview.apk
          unzip -l dehub-speed-preview.apk | grep 'assets/dexopt/baseline.prof'
      - uses: actions/upload-artifact@v4
        with:
          name: dehub-speed-preview
          path: |
            dehub-speed-preview.apk
            android-preview.json
            preview-apk-url.txt
          retention-days: 30

  android-frost-preview:
    name: Google Play frost testers
    needs: [verify, android-sdk55-preflight]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'upgrade/sdk55-android-frost-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx patch-package --error-on-fail
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed SDK 55 tester bundle
        run: eas build --platform android --profile store-testing --non-interactive --wait --json > android-frost-preview.json
      - name: Download and verify completed tester bundle
        run: |
          export EXPECTED_SOURCE_SHA="$(git rev-parse HEAD)"
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('android-frost-preview.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          if (build.status !== 'FINISHED' || build.platform !== 'ANDROID' || !build.artifacts?.buildUrl) throw new Error('No completed Android tester bundle');
          if (build.gitCommitHash !== process.env.EXPECTED_SOURCE_SHA) throw new Error('Tester bundle uses a different source commit');
          if (!/^[0-9a-f-]{36}$/i.test(build.id)) throw new Error('Invalid tester build ID');
          fs.writeFileSync('preview-bundle-url.txt', build.artifacts.buildUrl);
          fs.writeFileSync('tester-build-id.txt', build.id);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `[SDK 55 tester bundle](${build.artifacts.buildUrl})\n`);
          NODE
          curl --fail --location --retry 3 "$(cat preview-bundle-url.txt)" --output dehub-frost-preview.aab
          unzip -t dehub-frost-preview.aab
          unzip -l dehub-frost-preview.aab | grep 'base/manifest/AndroidManifest.xml'
          jarsigner -verify dehub-frost-preview.aab
          sha256sum dehub-frost-preview.aab
      - uses: actions/upload-artifact@v4
        with:
          name: dehub-frost-preview
          path: |
            dehub-frost-preview.aab
            android-frost-preview.json
            preview-bundle-url.txt
            tester-build-id.txt
          retention-days: 14
      - name: Release verified bundle to Google Play internal testers
        run: eas submit --platform android --profile store-testing --id "$(cat tester-build-id.txt)" --non-interactive --wait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-frost-build-result
          path: android-frost-preview.json
          if-no-files-found: ignore

  android-sdk55-preflight:
    name: Android SDK 55 preflight
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'upgrade/sdk55-android-frost-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Android JavaScript imports before the signed build
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sdk55-js-preflight"
      - name: Check upgraded Android manifest merges
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:processReleaseMainManifest --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

  ios-sdk55-compile:
    name: iOS SDK 55 compile
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'upgrade/sdk55-android-frost-20261005'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - run: npm ci --legacy-peer-deps
      - name: Resolve upgraded native pods
        working-directory: ios
        run: pod install --deployment
      - uses: actions/upload-artifact@v4
        with:
          name: sdk55-pod-lock
          path: ios/Podfile.lock
          retention-days: 14
      - name: Compile simulator native integrations
        run: |
          set -o pipefail
          xcodebuild -workspace ios/DeHub.xcworkspace -scheme DeHub \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sdk55-ios" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-sdk55-build.log | xcbeautify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sdk55-build-log
          path: ios-sdk55-build.log
          if-no-files-found: ignore
