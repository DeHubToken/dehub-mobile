name: put back pruned (branch only)

on:
  push:
    branches: [i18n-prune-garbled]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Put back values the refill's prune step removed
        run: |
          cat > /tmp/restore.mjs <<'EOF'
          import fs from 'node:fs';
          import { execSync } from 'node:child_process';
          const BASE = '5e102baa6';
          const dir = 'i18n/locales';
          const flat = (o, p = '', out = new Map()) => {
            for (const [k, v] of Object.entries(o)) {
              const key = p ? `${p}.${k}` : k;
              if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, key, out); else out.set(key, v);
            }
            return out;
          };
          const set = (root, key, val) => {
            const parts = key.split('.');
            let n = root;
            for (const p of parts.slice(0, -1)) { if (!n[p] || typeof n[p] !== 'object') n[p] = {}; n = n[p]; }
            n[parts.at(-1)] = val;
          };
          let total = 0;
          for (const f of fs.readdirSync(dir).filter((f) => f.endsWith('.json'))) {
            const file = `${dir}/${f}`;
            const text = fs.readFileSync(file, 'utf8');
            const pre = JSON.parse(execSync(`git show ${BASE}:${file}`, { encoding: 'utf8', maxBuffer: 1e9 }));
            const now = JSON.parse(text);
            const preFlat = flat(pre);
            const nowFlat = flat(now);
            const lost = [...preFlat.keys()].filter((k) => !nowFlat.has(k));
            if (!lost.length) continue;
            const out = structuredClone(pre);
            for (const [k, v] of nowFlat) if (preFlat.get(k) !== v) set(out, k, v);
            const nl = text.includes('\r\n') ? '\r\n' : '\n';
            fs.writeFileSync(file, JSON.stringify(out, null, 2).split('\n').join(nl) + nl);
            total += lost.length;
            console.log(`${f}: put back ${lost.join(', ')}`);
          }
          console.log(`put back ${total}`);
          EOF
          node /tmp/restore.mjs
      - run: node scripts/i18n-fanout.mjs --prune --garbled --dry-run | grep '^  ' || echo "no garbled values left"
      - run: |
          git config user.name maldoteth
          git config user.email dev@dehub.io
          git add i18n/locales/*.json
          git commit -q -m "Keep the values the refill's prune step removed"
          git push origin HEAD:i18n-prune-garbled
