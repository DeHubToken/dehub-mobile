name: iOS simulator check

# Builds the iPhone app in Release with the same Xcode as the store build,
# runs it on an iPhone simulator, opens every main page in light and dark,
# and keeps the screenshots, the app log and any crash reports. Run it from
# Actions before an App Store submission.
#
# task "nav" times page switches instead (tabs, profiles, posts, Settings,
# Back): once with main's app code and once with this branch's, in the same
# native build, so the two columns differ only by the change being checked.
on:
  workflow_dispatch:
    inputs:
      themes:
        description: 'Walks to run, space separated: dark, light, syslight (System Light)'
        required: false
        default: 'dark light syslight'
      task:
        description: 'walk = open every page and screenshot it. nav = time page switches, main against this branch. probe = look for where a switch spends its time'
        required: false
        default: 'walk'
      app_run_id:
        description: 'nav only: reuse the simulator app an earlier run of this workflow built (its run id), when native code has not changed'
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/ios-simulator-check.yml
      - scripts/ios-simulator-walk.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-simulator-check-${{ github.ref }}-${{ inputs.task || 'walk' }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build and walk the app on an iPhone simulator
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use the store build's Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - run: npm ci --legacy-peer-deps
      - run: npx patch-package --error-on-fail
      - name: Prepare recording extension targets
        if: inputs.app_run_id == ''
        run: |
          gem install xcodeproj --version 1.27.0 --no-document
          ruby scripts/configure-screen-capture-targets.rb
      # Plain install, as the store build does: the committed Podfile.lock
      # trails autolinking, so --deployment refuses it.
      - name: Install pods
        if: inputs.app_run_id == ''
        working-directory: ios
        run: pod install
      - name: Run the code in this commit, not the latest published update
        if: inputs.app_run_id == ''
        run: plutil -replace EXUpdatesEnabled -bool NO ios/DeHub/Supporting/Expo.plist
      - name: Boot an iPhone simulator
        id: sim
        run: |
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rs.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          print(rs[-1]["identifier"])')"
          TYPE="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          names = [d["name"] for d in json.load(sys.stdin)["devicetypes"]]
          for want in ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro"]:
              if want in names:
                  print(want); break')"
          UDID="$(xcrun simctl create riftn-check "$TYPE" "$RUNTIME")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $TYPE on $RUNTIME"
      # Signed to run locally, as Xcode does for a simulator: an unsigned app
      # gets no keychain there, so sign-in state never loads.
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # The app's config (Supabase key and the rest) is inlined into the bundle
      # at build time from the EAS production environment, as the store build
      # does. Without it the app throws "supabaseKey is required" on launch.
      - name: Build Release for the simulator
        if: inputs.app_run_id == ''
        run: |
          cat > "$RUNNER_TEMP/build-sim.sh" <<'SH'
          set -o pipefail
          xcodebuild -workspace ios/DeHub.xcworkspace -scheme DeHub \
            -configuration Release -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/sim" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER= build 2>&1 | tee xcodebuild.log | xcbeautify --quiet
          SH
          eas env:list production | sed -E 's/=.*/= <set>/'
          eas env:exec production "bash $RUNNER_TEMP/build-sim.sh"
      # Kept so a later nav run can skip the hour-long native build.
      - name: Pack the simulator app
        if: inputs.app_run_id == ''
        run: |
          APP="$(find "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          tar -czf "$RUNNER_TEMP/ios-simulator-app.tgz" -C "$(dirname "$APP")" "$(basename "$APP")"
      - uses: actions/upload-artifact@v4
        if: inputs.app_run_id == ''
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/ios-simulator-app.tgz
          retention-days: 14
          compression-level: 0
      - uses: actions/download-artifact@v4
        if: inputs.app_run_id != ''
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/app-download
          run-id: ${{ inputs.app_run_id }}
          github-token: ${{ github.token }}
      - name: Unpack the reused simulator app
        if: inputs.app_run_id != ''
        run: |
          mkdir -p "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator"
          tar -xzf "$RUNNER_TEMP/app-download/ios-simulator-app.tgz" -C "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator"
      # iOS 26 asks "Open in …?" before a simulator opens a deep link; idb taps Open.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Without it no deep link opens and the whole walk is wasted, so this
      # retries the download (GitHub release downloads flake) and then fails.
      - name: Install idb for taps
        run: |
          brew tap facebook/fb
          for attempt in 1 2 3 4; do
            brew install facebook/fb/idb-companion && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 20))
          done
          python -m venv "$RUNNER_TEMP/idb"
          "$RUNNER_TEMP/idb/bin/pip" install --quiet fb-idb pillow
          echo "$RUNNER_TEMP/idb/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/idb/bin/idb" list-targets || true
      - name: Summarise build warnings
        if: always()
        run: |
          mkdir -p sim-check
          touch xcodebuild.log
          grep -E "(warning|error):" xcodebuild.log | grep -v "/Pods/" | sort | uniq -c | sort -rn > sim-check/app-warnings.txt || true
          grep -cE "warning:" xcodebuild.log > sim-check/warning-count.txt || true
          gzip -c xcodebuild.log > sim-check/xcodebuild.log.gz
      - name: Walk every page in dark, light and System Light
        if: inputs.task != 'nav' && inputs.task != 'probe'
        run: |
          APP="$(find "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          scripts/ios-simulator-walk.sh "${{ steps.sim.outputs.udid }}" "$APP" sim-check
        env:
          THEMES: ${{ inputs.themes || 'dark light syslight' }}
      - name: Time page switches, main against this branch
        if: inputs.task == 'nav' || inputs.task == 'probe'
        env:
          NAV_MODE: ${{ inputs.task }}
          SIM_TEST_KEY: ${{ secrets.SIM_TEST_KEY }}
        run: |
          APP="$(find "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          git fetch --depth=1 origin "$GITHUB_REF_NAME" && git checkout -q --detach FETCH_HEAD
          scripts/ios-nav-timing.sh "${{ steps.sim.outputs.udid }}" "$APP" sim-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-check
          path: sim-check/
          if-no-files-found: ignore
