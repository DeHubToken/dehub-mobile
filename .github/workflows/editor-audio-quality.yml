name: Editor audio quality
on:
  pull_request:
    paths:
      - 'libs/editor/audioToolsRuntime.ts'
      - 'tests/editor/audio-quality.mjs'
      - '.github/workflows/editor-audio-quality.yml'
  push:
    branches: [main]
    paths:
      - 'libs/editor/audioToolsRuntime.ts'
      - 'tests/editor/audio-quality.mjs'
      - '.github/workflows/editor-audio-quality.yml'
permissions:
  contents: read
concurrency:
  group: editor-audio-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audio-quality:
    name: Voice detail and stereo preservation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure reference sound and noisy recordings
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/editor/audio-quality.mjs libs/editor/audioToolsRuntime.ts "$BASE_REF" audio-quality-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-audio-quality
          path: audio-quality-results.json
          if-no-files-found: error
