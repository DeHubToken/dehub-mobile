name: Generate Android startup profiles
description: Generate and preserve native profiles before uploading the source to EAS.
inputs:
  environment:
    description: EAS environment used for the profile-generation bundle
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Enable emulator hardware acceleration
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --settle --name-match=kvm
        sudo chmod 0666 /dev/kvm
        ls -l /dev/kvm
        test -r /dev/kvm && test -w /dev/kvm
    - name: Assemble the profiling app before starting the emulator
      shell: bash
      run: eas env:exec ${{ inputs.environment }} "cd android && chmod +x gradlew && ./gradlew :app:assembleNonMinifiedRelease -Pdehub.generateProfiles=true -PreactNativeArchitectures=x86_64 --no-daemon"
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: aosp_atd
        arch: x86_64
        disable-linux-hw-accel: false
        emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
        disable-animations: true
        script: eas env:exec ${{ inputs.environment }} "cd android && chmod +x gradlew && ./gradlew :app:generateReleaseBaselineProfile -Pdehub.generateProfiles=true -PreactNativeArchitectures=x86_64 --no-daemon"
    - name: Require generated profiles
      shell: bash
      run: |
        test -s android/app/src/release/generated/baselineProfiles/baseline-prof.txt
        test -s android/app/src/release/generated/baselineProfiles/startup-prof.txt
    - uses: actions/upload-artifact@v4
      with:
        name: android-startup-profiles
        path: android/app/src/release/generated/baselineProfiles/
        retention-days: 30
